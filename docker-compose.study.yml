version: '3.8'

# Déploiement isolé de la page d'étude d'autorégulation (/autoreg) — build
# séparé du reste de MYPICU (VITE_STUDY_ONLY=true), destiné à sa propre VM ou
# à un port distinct de la production sur la même machine. Voir le plan de
# déploiement de la page d'étude pour le contexte complet.
#
#   VITE_SUPABASE_URL=... VITE_SUPABASE_ANON_KEY=... docker compose -f docker-compose.study.yml up -d --build

services:
  app-study:
    build:
      context: .
      dockerfile: Dockerfile.nginx
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_STUDY_ONLY: "true"
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - app-study-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-study-network:
    driver: bridge
