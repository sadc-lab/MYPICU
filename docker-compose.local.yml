name: mypicu-local

# Memory ceilings for an 11 GiB host with no swap.
#
# These are ceilings, not reservations: the stack idles at about 1.7 GiB, and
# only the autoregulation fit and the database work at the top of their range.
# Each is set individually so no single process can exhaust the machine, which
# with no swap means the kernel would start killing arbitrary processes.
x-memory: &memory
  db: &mem_db "2g"
  autoreg: &mem_autoreg "3g"   # peak measured at 1.2 GiB on a 2h window
  module: &mem_module "1g"
  worker: &mem_worker "1g"
  realtime: &mem_realtime "640m"
  service: &mem_service "384m"
  auth: &mem_auth "192m"
  envoy: &mem_envoy "96m"
  web: &mem_web "96m"

x-worker: &worker
  image: mypicu-worker:local
  build: ./docker/worker
  mem_limit: *mem_worker

services:
  db:
    mem_limit: *mem_db
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/local-env.py}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
      - ./docker/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-local-roles.sql:ro
      - ./docker/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
    # Sized for an 11 GiB host. The stock effective_cache_size assumes a much
    # larger machine, which only misleads the planner, but shared_buffers is
    # real memory and a modest value leaves room for the module containers.
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf, -c, log_min_messages=fatal,
              -c, shared_buffers=1GB, -c, effective_cache_size=8GB,
              -c, work_mem=8MB, -c, maintenance_work_mem=128MB]
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -h, localhost]
      interval: 5s
      timeout: 5s
      retries: 30

  auth:
    mem_limit: *mem_auth
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      mailpit: {condition: service_started}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${PUBLIC_URL}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${PUBLIC_URL}
      GOTRUE_URI_ALLOW_LIST: ${PUBLIC_URL}/**,http://127.0.0.1:8080/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${PUBLIC_URL}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@mypicu.local
      GOTRUE_SMTP_SENDER_NAME: MYPICU Local
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
    healthcheck:
      test: [CMD, wget, --spider, -q, http://localhost:9999/health]
      interval: 5s
      timeout: 5s
      retries: 30

  db-migrate:
    <<: *worker
    depends_on:
      auth: {condition: service_healthy}
    command: [python, migrate.py]
    environment:
      LOCAL_DSN: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      SYNC_PASSWORD: ${SYNC_PASSWORD}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      DEV_USER_PASSWORD: ${DEV_USER_PASSWORD}
      ANON_KEY: ${ANON_KEY}
    volumes:
      - ./docker/db:/db:ro
      - ./supabase/migrations:/migrations:ro

  rest:
    mem_limit: *mem_auth
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    depends_on:
      db-migrate: {condition: service_completed_successfully}
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      # Validity/medications are not paginated by the existing frontend.
      PGRST_DB_MAX_ROWS: 100000
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
    healthcheck:
      test: [CMD, postgrest, --ready]
      interval: 5s
      timeout: 5s
      retries: 10

  realtime:
    mem_limit: *mem_realtime
    image: supabase/realtime:v2.134.10
    restart: unless-stopped
    depends_on:
      db-migrate: {condition: service_completed_successfully}
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: 10000
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"
    healthcheck:
      test: [CMD-SHELL, 'curl -sf -H "Authorization: Bearer ${ANON_KEY}" http://localhost:4000/api/tenants/realtime-dev/health > /dev/null']
      interval: 15s
      timeout: 5s
      retries: 15

  gateway-init:
    <<: *worker
    command: [python, render_gateway.py]
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    volumes:
      - ./docker/envoy/envoy.yaml:/envoy.template.yaml:ro
      - envoy-config:/generated

  envoy:
    mem_limit: *mem_envoy
    image: envoyproxy/envoy:v1.39.1
    restart: unless-stopped
    depends_on:
      gateway-init: {condition: service_completed_successfully}
      web: {condition: service_healthy}
      rest: {condition: service_healthy}
      auth: {condition: service_healthy}
      realtime: {condition: service_healthy}
    ports: [127.0.0.1:8080:8000]
    volumes:
      - envoy-config:/etc/envoy:ro
    command: [envoy, -c, /etc/envoy/envoy.yaml, --log-level, warn]
    healthcheck:
      test: [CMD-SHELL, "timeout 1 bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    mem_limit: *mem_web
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        ANON_KEY: ${ANON_KEY}
        # Empty: the browser client resolves the API from the page origin, so the
        # app works on the gateway port, a forwarded port or a hostname.
        SUPABASE_API_URL: ${SUPABASE_API_URL:-}
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    mem_limit: *mem_envoy
    image: axllent/mailpit:v1.27.10
    restart: unless-stopped
    ports: [127.0.0.1:8025:8025]

  meta:
    mem_limit: *mem_service
    image: supabase/postgres-meta:v0.99.0
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

  studio:
    mem_limit: *mem_service
    image: supabase/studio:2026.09.07-sha-7996410
    restart: unless-stopped
    depends_on:
      meta: {condition: service_started}
      envoy: {condition: service_healthy}
    ports: [127.0.0.1:54323:3000]
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: public
      DEFAULT_ORGANIZATION_NAME: MYPICU
      DEFAULT_PROJECT_NAME: Local PICU
      SUPABASE_URL: http://envoy:8000
      SUPABASE_PUBLIC_URL: ${PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      ENABLED_FEATURES_LOGS_ALL: "false"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/api/platform/profile').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Clinical computation service. Reads the raw CSVs the sync worker writes
  # into the shared volume and produces the hourly adherence matrices and
  # brain autoregulation results. Single worker is mandatory: the pipeline
  # uses process-global state and a shared results directory.
  optibrain:
    mem_limit: *mem_module
    image: mypicu-optibrain:local
    build: ../optibrain
    restart: unless-stopped
    env_file: ../optibrain/.env
    environment:
      DB_MAX_CONCURRENT_QUERIES: ${ICCA_QUERY_CONCURRENCY:-4}
    volumes:
      - optibrain-data:/app/donnees
      - optibrain-results:/app/results
    networks: [default]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Autoregulation runs in its own instance. The pipeline keeps module-global
  # configuration and serialises every request behind one lock, so a 35-minute
  # fit would otherwise stall the indicator extraction that the sync cycle
  # depends on. It gets a private results volume and a private input volume so
  # a long analysis cannot read channels the worker is halfway through
  # rewriting.
  optibrain-autoreg:
    mem_limit: *mem_autoreg
    image: mypicu-optibrain:local
    build: ../optibrain
    restart: unless-stopped
    env_file: ../optibrain/.env
    environment:
      DB_MAX_CONCURRENT_QUERIES: ${ICCA_QUERY_CONCURRENCY:-4}
    volumes:
      - optibrain-ar-data:/app/donnees
      - optibrain-ar-results:/app/results
    networks: [default]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5

  optibrain-sync:
    <<: *worker
    restart: unless-stopped
    depends_on:
      db-migrate: {condition: service_completed_successfully}
      optibrain: {condition: service_healthy}
    env_file: ../optibrain/.env
    environment:
      LOCAL_DSN: postgresql://optibrain_sync:${SYNC_PASSWORD}@db:5432/postgres
      SYNC_TOKEN: ${SYNC_TOKEN}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-900}
      PATIENT_RETENTION_DAYS: ${PATIENT_RETENTION_DAYS:-3}
      SOURCE_TIMEZONE: America/Montreal
      ICCA_QUERY_CONCURRENCY: ${ICCA_QUERY_CONCURRENCY:-4}
      # Same volume, same path on both sides, so the CSVs written here are the
      # ones the module reads.
      OPTIBRAIN_EXPORT_DIR: /optibrain/donnees
      OPTIBRAIN_AR_EXPORT_DIR: /optibrain-ar/donnees
      OPTIBRAIN_URL: http://optibrain:8000
      OPTIBRAIN_AR_URL: http://optibrain-autoreg:8000
      OPTIBRAIN_TOKEN: ${SYNC_TOKEN}
    volumes:
      - optibrain-data:/optibrain/donnees
      - optibrain-ar-data:/optibrain-ar/donnees
    networks: [default]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  db-data:
  db-config:
  envoy-config:
  optibrain-data:
  optibrain-results:
  optibrain-ar-data:
  optibrain-ar-results:
