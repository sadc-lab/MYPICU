version: '3.8'

services:
  # Frontend with Nginx
  app-nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
      # Vite fige ces valeurs dans le bundle au moment du build : elles doivent
      # être des arguments de build, pas des variables d'exécution (voir .env).
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-network:
    driver: bridge
