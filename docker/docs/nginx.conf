# Static server for the Sphinx build.
#
# Envoy forwards the full request path to this service without a prefix
# rewrite, so /documentation/<page>.html maps to
# /usr/share/nginx/html/documentation/<page>.html. Keeping the prefix intact
# is what lets the theme's relative asset paths resolve correctly.

server {
    listen 80;
    server_name _;
    # Root is the parent directory, NOT the documentation directory: nginx
    # appends the full request URI to root, so /documentation/x.html must
    # resolve against <root>/documentation/x.html. Setting root to the
    # documentation directory itself would look for a doubled prefix.
    root /usr/share/nginx/html;

    # Documentation is static; never let the client cache a stale build during
    # an incident, since operators need the current runbook immediately.
    add_header Cache-Control "no-store" always;

    index index.html;

    location /documentation/ {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /documentation {
        return 301 /documentation/;
    }

    location / {
        return 301 /documentation/;
    }

    # Sphinx emits .doctrees and source leftovers on some builds; never serve them.
    location ~ /\. {
        deny all;
    }

    location ~* \.doctrees?$ {
        deny all;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}