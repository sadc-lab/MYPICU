# Minimal local Supabase gateway, using the upstream Envoy route conventions.
# Only legacy signed JWT API keys are configured; Auth/REST/Realtime verify JWTs.
static_resources:
  listeners:
    - name: local
      address:
        socket_address: {address: 0.0.0.0, port_value: 8000}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: mypicu
                normalize_path: true
                use_remote_address: true
                upgrade_configs: [{upgrade_type: websocket}]
                # Path only: query strings can contain API keys and patient IDs.
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "[%START_TIME%] %REQ(:METHOD)% %REQ_WITHOUT_QUERY(:PATH)% %RESPONSE_CODE% %DURATION%ms %RESPONSE_FLAGS% ua=\"%REQ(USER-AGENT)%\"\n"
                        formatters:
                          - name: envoy.formatter.req_without_query
                            typed_config:
                              '@type': type.googleapis.com/envoy.extensions.formatter.req_without_query.v3.ReqWithoutQuery
                route_config:
                  name: local
                  virtual_hosts:
                    - name: local
                      domains: ['*']
                      routes:
                        - match: {path: /health}
                          direct_response: {status: 200, body: {inline_string: healthy}}
                        # No prefix rewrite: the Sphinx build sets html_baseurl to
                        # /documentation/ and emits relative asset paths, so the
                        # prefix has to survive the hop to the docs container.
                        - match: {prefix: /documentation}
                          route: {cluster: docs, timeout: 30s}
                        - match: {prefix: /auth/v1/}
                          route: {cluster: auth, prefix_rewrite: /, timeout: 30s}
                          request_headers_to_add:
                            - header: {key: X-Forwarded-Prefix, value: /auth/v1}
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                        - match: {prefix: /rest/v1/}
                          route: {cluster: rest, prefix_rewrite: /, timeout: 60s}
                        - match: {path: /realtime/v1/websocket}
                          route:
                            cluster: realtime
                            prefix_rewrite: /socket/websocket
                            host_rewrite_literal: realtime-dev.supabase-realtime
                            timeout: 0s
                            idle_timeout: 0s
                        - match: {prefix: /realtime/v1/}
                          direct_response: {status: 404}
                        - match: {prefix: /}
                          route: {cluster: web, timeout: 30s}
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      inline_code: |
                        function envoy_on_request(h)
                          local headers = h:headers()
                          local path = headers:get(":path") or ""
                          local api = path:match("^/rest/v1/") or path:match("^/realtime/v1/") or path:match("^/auth/v1/")
                          if not api then return end
                          if path:match("^/auth/v1/verify") or path:match("^/auth/v1/callback") or path:match("^/auth/v1/health") then return end
                          local key = headers:get("apikey") or path:match("[?&]apikey=([^&]+)")
                          if key ~= "${ANON_KEY}" and key ~= "${SERVICE_ROLE_KEY}" then
                            h:respond({[":status"]="401"}, "Invalid API key")
                            return
                          end
                          if path:match("^/realtime/v1/") then
                            headers:replace("x-api-key", key)
                          elseif not headers:get("authorization") then
                            headers:add("authorization", "Bearer " .. key)
                          end
                        end
                  - name: envoy.filters.http.router
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: auth
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: auth
        endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: auth, port_value: 9999}}}}]}]
    - name: rest
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: rest
        endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: rest, port_value: 3000}}}}]}]
    - name: realtime
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: realtime
        endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: realtime, port_value: 4000}}}}]}]
    - name: docs
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: docs
        endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: docs, port_value: 80}}}}]}]
    - name: web
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: web
        endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: web, port_value: 3000}}}}]}]
